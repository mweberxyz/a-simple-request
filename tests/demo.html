<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site Tests</title>
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 24px; color: #1f2328; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  #summary { font-weight: 700; margin-bottom: 12px; }
  .pass { color: #1a7f37; } .fail { color: #cf222e; }
  li { margin: 2px 0; } li small { color: #59636e; }
  #frames { position: absolute; left: -10000px; top: 0; }
  #frames iframe { border: 0; display: block; }
</style>
</head>
<body>
<h1>Site tests</h1>
<div id="summary">Running…</div>
<ul id="list"></ul>
<pre id="results" hidden></pre>
<div id="frames"></div>

<script>
// Loads the real site in iframes at several widths and checks the demo's behavior.
// Run headless with tests/run.sh, or open /tests/demo.html from a server rooted at the repo.
const SITE = "../docs/index.html", DRAFT = "../request/feature-request.md";
const WIDTHS = [1280, 1024, 375, 360];  // 360 = common Android width
const results = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function load(url, width, height = 900) {
  return new Promise((resolve, reject) => {
    const f = document.createElement("iframe");
    f.style.width = width + "px"; f.style.height = height + "px";
    f.onload = async () => { await sleep(300); resolve(f.contentWindow); };
    f.onerror = reject;
    f.src = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
    document.getElementById("frames").appendChild(f);
  });
}
async function test(name, fn) {
  try { await fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, error: String(e && e.message || e) }); }
}
function assert(cond, msg) { if (!cond) throw new Error(msg); }
function eq(a, b, msg) { if (a !== b) throw new Error(`${msg}: expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

// WCAG contrast ratio between two computed "rgb(...)" colors.
function contrast(a, b) {
  const lum = c => { const [r, g, bl] = c.match(/[\d.]+/g).slice(0, 3).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * bl; };
  const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05);
}

// Every visible text node against the real color behind it (stacking translucent backgrounds).
// Returns failures as strings. Skips gradient text, hidden and faded-out text, and the selected
// mode button, whose background is the sliding thumb (a sibling the walk can't see).
function lowContrast(w) {
  // Computed colors come as rgb()/rgba() (0–255) or, from color-mix(), as color(srgb r g b / a) (0–1).
  const parse = c => { const n = (c.match(/[\d.]+/g) || [0, 0, 0, 0]).map(Number); return c.startsWith("color(") ? [...n.slice(0, 3).map(v => v * 255), ...n.slice(3)] : n; };
  const blend = (top, bot) => { const a = top.length > 3 ? top[3] : 1; return [0, 1, 2].map(i => top[i] * a + bot[i] * (1 - a)); };
  const lum = ([r, g, b]) => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
  const bgOf = el => { const st = []; for (let e = el; e; e = e.parentElement) { const c = parse(w.getComputedStyle(e).backgroundColor); if (c.length < 4 || c[3] > 0) st.push(c); if (c.length < 4 || c[3] === 1) break; } let acc = [255, 255, 255]; for (let i = st.length - 1; i >= 0; i--) acc = blend(st[i], acc); return acc; };
  // Measure final colors: headless Chrome's virtual clock doesn't always finish CSS transitions.
  const still = w.document.createElement("style"); still.textContent = "*, *::before, *::after { transition: none !important; }";
  w.document.head.appendChild(still); void w.document.body.offsetHeight;
  try {
  const bad = [], seen = new Set(), walk = w.document.createTreeWalker(w.document.body, w.NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) {
    const node = walk.currentNode, el = node.parentElement;
    if (!node.textContent.trim() || seen.has(el)) continue; seen.add(el);
    const cs = w.getComputedStyle(el);
    if (!el.offsetWidth || cs.visibility === "hidden" || cs.color === "rgba(0, 0, 0, 0)") continue;
    if (el.closest("[aria-hidden=true], .sr-only, .guess, .seg.mode button[aria-pressed=true]")) continue;
    const tip = el.closest(".tip"); if (tip && w.getComputedStyle(tip).display === "none") continue;
    let op = 1; for (let e = el; e; e = e.parentElement) op *= parseFloat(w.getComputedStyle(e).opacity); if (op < 0.5) continue;
    const bg = bgOf(el), [x, y] = [lum(blend(parse(cs.color), bg)), lum(bg)].sort((m, n) => n - m), r = (x + 0.05) / (y + 0.05);
    const size = parseFloat(cs.fontSize), large = size >= 24 || (parseInt(cs.fontWeight) >= 700 && size >= 18.66);
    if (r < (large ? 3 : 4.5)) bad.push(`${r.toFixed(2)} "${node.textContent.trim().slice(0, 30)}"`);
  }
  return bad;
  } finally { still.remove(); }
}

// Helpers that drive the demo the way a visitor would.
const $ = (w, sel) => w.document.querySelector(sel);
const $$ = (w, sel) => [...w.document.querySelectorAll(sel)];
const h1 = w => $(w, "#prompt h1").textContent.trim();
const mode = (w, v) => $(w, `[data-key=mode] [data-v=${v}]`).click();
const pick = (w, who) => $(w, `.pick[data-pick=${who}]`).click();
const reset = w => $(w, "#reset").click();
const positions = w => [$(w, ".win"), ...$$(w, "#thread .box")].map(el => (el.getBoundingClientRect().top + w.scrollY).toFixed(1)).join(",");

(async () => {
  for (const width of WIDTHS) {
    const w = await load(SITE, width);
    const tag = `@${width}px`;

    await test(`opens on the puzzle ${tag}`, async () => {
      reset(w);
      eq(h1(w), "Spot the slop.", "headline");
      eq($$(w, ".pick").length, 2, "clickable replies");
      eq($$(w, "#thread .tag").length, 0, "no agent tag today");
      assert(w.getComputedStyle($(w, "#tagctl")).visibility === "hidden", "tag control hidden today");
    });

    await test(`picking the agent's comment is right ${tag}`, async () => {
      reset(w); pick(w, "agent");
      assert(h1(w).startsWith("Good eye"), `headline was "${h1(w)}"`);
      eq($$(w, "#thread .tag").length, 1, "agent tagged");
      assert(w.getComputedStyle($(w, "#tagctl")).visibility === "visible", "tag control visible tomorrow");
      assert($(w, ".seg.mode").classList.contains("reveal"), "reveal animation triggered");
    });

    await test(`clicking GitHub tomorrow animates the tag in ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      const t = $(w, "#thread .tag");
      assert(t && t.classList.contains("pop") && t.classList.contains("pop-quick"), "tag should pop in on a direct switch");
      $(w, "[data-key=style] [data-v=purple]").click();
      assert(!$(w, "#thread .tag").classList.contains("pop"), "tag should not re-pop on later changes");
      reset(w); pick(w, "human"); mode(w, "today");
      $(w, "#prompt [data-go=proposal]").click();
      assert($(w, "#thread .tag").classList.contains("pop-quick"), "Show me tomorrow link should pop the tag too");
      $(w, "[data-key=style] [data-v=purple]").click(); reset(w);
    });

    await test(`the result screens don't link away ${tag}`, async () => {
      reset(w); pick(w, "agent");
      assert(!$(w, "#prompt a"), "no link in the result");
      reset(w);
    });

    await test(`the tag is purple by default, with no grey option ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      assert($(w, "#thread .tag").classList.contains("purple"), "default tag should be purple");
      assert(!$(w, "[data-key=style] [data-v=grey]"), "grey option should be gone");
      reset(w);
    });

    await test(`role badges line up on the right, like GitHub ${tag}`, async () => {
      const check = label => {
        const offs = $$(w, "#thread .hd").map(h => {
          const r = h.querySelector(".role");
          if (!r || w.getComputedStyle(r).display === "none") return null;
          return Math.round(h.getBoundingClientRect().right - r.getBoundingClientRect().right);
        }).filter(v => v !== null);
        if (!offs.length) return;  // badges are hidden on phones
        assert(new Set(offs).size === 1, `${label}: badges not aligned ${JSON.stringify(offs)}`);
      };
      reset(w); check("today");
      mode(w, "proposal"); check("tomorrow");
      reset(w);
    });

    await test(`picking the human's comment is wrong ${tag}`, async () => {
      reset(w); pick(w, "human");
      assert(h1(w).startsWith("Nope"), `headline was "${h1(w)}"`);
    });


    await test(`can guess again after going back to today ${tag}`, async () => {
      reset(w); pick(w, "human"); mode(w, "today");
      eq(h1(w), "Back to today. Can you still spot it?", "headline");
      eq($$(w, ".pick").length, 2, "replies clickable again");
      pick(w, "agent");
      assert(h1(w).startsWith("Good eye"), `headline was "${h1(w)}"`);
    });

    await test(`thread never moves between states ${tag}`, async () => {
      reset(w); const seen = { today: positions(w) };
      mode(w, "proposal"); seen.tomorrow = positions(w);
      mode(w, "today"); seen.back = positions(w);
      reset(w); pick(w, "agent"); seen.right = positions(w);
      reset(w); pick(w, "human"); seen.wrong = positions(w);
      const distinct = new Set(Object.values(seen));
      assert(distinct.size === 1, "positions differ: " + JSON.stringify(seen));
    });

    await test(`no horizontal scroll and one-line headers ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      $(w, "[data-key=style] [data-v=custom]").click();
      for (let i = 0, n = w.eval("TURBO.length"); i < n; i++) {
        eq(w.document.documentElement.scrollWidth, width, "page width");
        assert(!$$(w, "#thread .hd").some(h => h.scrollWidth > h.clientWidth + 1), `a comment header overflows (${$(w, "#thread .tag .txt").textContent})`);
        w.turboTick();
      }
      reset(w);
    });

    await test(`only the tag control remains, above the thread on the right ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      for (const k of ["viewer", "filter"]) assert(!$(w, `[data-key=${k}]`), `${k} control should be gone`);
      eq([...$$(w, "[data-key=style] button")].map(b => b.textContent).join("|"), "Boring|Turbo", "tag options");
      const turbo = $(w, "[data-key=style] [data-v=custom]");
      assert(w.getComputedStyle(turbo).animationName.includes("turboNudge"), "Turbo should wiggle until chosen");
      assert(w.getComputedStyle(turbo.querySelector(".rb")).animationName === "rainbow", "Turbo text should be a moving rainbow");
      turbo.click();
      assert(!w.getComputedStyle(turbo).animationName.includes("turboNudge"), "wiggle stops once Turbo is on");
      const c = $(w, "#tagctl").getBoundingClientRect(), win = $(w, ".win").getBoundingClientRect();
      assert(c.bottom <= win.top, "tag control should sit above the thread");
      assert(Math.abs(c.right - win.right) < 2, `tag control should be flush right (${c.right} vs ${win.right})`);
      reset(w);
    });

    await test(`Turbo cycles its own colors and labels, with nothing to pick ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      assert(!$(w, "#tagctl input") && !$(w, "#swatches"), "no picker");
      $(w, "[data-key=style] [data-v=custom]").click();
      assert(w.__turboT, "cycle should be running");
      const look = () => $(w, "#thread .tag .txt").textContent + " " + $(w, "#thread .tag").style.color;
      const first = look(); w.turboTick();
      assert(look() !== first, "label and color should change");
      assert($(w, "#thread .tag").classList.contains("swap"), "change should animate");
      $(w, "[data-key=style] [data-v=purple]").click();
      assert(!w.__turboT, "Boring stops the cycle");
      $(w, "[data-key=style] [data-v=custom]").click(); reset(w);
      assert(!w.__turboT, "reset stops the cycle");
    });

    await test(`Turbo swaps in a conversation that fits each label, and the page stays put ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      const win = () => { const r = $(w, ".win").getBoundingClientRect(); return `${r.top.toFixed(1)}/${r.height.toFixed(1)}`; };
      const agentText = () => $(w, "[data-pick=agent], #thread .c:last-child .bd").textContent;
      const before = win(), mainTitle = $(w, "#title").textContent;
      $(w, "[data-key=style] [data-v=custom]").click();
      const seen = new Set();
      for (let i = 0, n = w.eval("TURBO.length"); i < n; i++) {
        eq(win(), before, `window moved or resized on "${$(w, "#thread .tag .txt").textContent}"`);
        seen.add($(w, "#title").textContent + "|" + $(w, "#thread .c:last-child .bd").textContent);
        assert(!$(w, "#title").textContent.includes("ECONNRESET when reusing"), "Turbo should swap the issue");
        w.turboTick();
      }
      eq(seen.size, w.eval("TURBO.length"), "each label gets its own conversation");
      $(w, "[data-key=style] [data-v=purple]").click();
      eq($(w, "#title").textContent, mainTitle, "Boring brings back the puzzle thread");
      eq(win(), before, "window after Boring");
      reset(w);
    });

    await test(`a countdown bar under the conversation matches the tag color ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      const bar = $(w, "#cycle");
      assert(!bar.classList.contains("on"), "no bar with Boring");
      $(w, "[data-key=style] [data-v=custom]").click();
      try {
      for (let i = 0; i < 2; i++) {
        assert(bar.classList.contains("on") && bar.classList.contains("run"), "bar should be counting down");
        eq(bar.style.getPropertyValue("--c"), w.eval("TURBO[s.turbo].fg"), "bar color = tag color");
        assert($(w, "#thread .tag").getAttribute("style").includes("color:" + w.eval("TURBO[s.turbo].fg")), "tag uses the same color");
        w.turboTick();
      }
      const win = $(w, ".win").getBoundingClientRect(), b = bar.getBoundingClientRect();
      assert(Math.abs(b.bottom - win.bottom) < 2 && b.top > $(w, "#thread .c:last-child").getBoundingClientRect().bottom, "bar sits under the conversation");
      $(w, "[data-key=style] [data-v=purple]").click();
      assert(!bar.classList.contains("on"), "Boring hides the bar");
      } finally { reset(w); }
    });

    await test(`left and right arrows step through Turbo ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      const key = k => w.document.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));
      const label = () => $(w, "#thread .tag .txt").textContent;
      const boring = label(); key("ArrowRight");
      eq(label(), boring, "arrows do nothing outside Turbo");
      $(w, "[data-key=style] [data-v=custom]").click();
      try {
        const n = w.eval("TURBO.length"), at = () => w.eval("s.turbo");
        const start = at();
        key("ArrowRight"); eq(at(), (start + 1) % n, "right goes forward");
        key("ArrowLeft"); key("ArrowLeft"); eq(at(), (start - 1 + n) % n, "left goes back, wrapping around");
        assert($(w, "#cycle").classList.contains("run") && w.__turboT, "countdown restarts");
      } finally { reset(w); }
    });

    await test(`a keyboard can make the guess, and lands on the answer ${tag}`, async () => {
      reset(w);
      const btns = $$(w, "#thread .guess");
      eq(btns.length, 2, "one guess button per reply");
      assert(btns.every(b => b.tagName === "BUTTON" && /agent wrote this/.test(b.getAttribute("aria-label"))), "guess buttons are named");
      $(w, ".pick[data-pick=agent] .guess").click();   // keyboard activation has event.detail 0
      assert(h1(w).startsWith("Good eye"), `headline was "${h1(w)}"`);
      eq(w.document.activeElement, $(w, "#thread .tag"), "focus moves to the agent tag");
      reset(w);
    });

    await test(`the agent tag is a named button described by its tooltip ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      const t = $(w, "#thread .tag");
      eq(t.tagName, "BUTTON", "tag element");
      eq($(w, "#" + t.getAttribute("aria-labelledby")).textContent, "agent", "accessible name");
      assert(/hasn't reviewed/.test($(w, "#" + t.getAttribute("aria-describedby")).textContent), "described by the tooltip");
      t.focus(); assert(w.getComputedStyle($(w, "#tagtip")).display !== "none", "tooltip shows on focus");
      w.document.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      eq(w.getComputedStyle($(w, "#tagtip")).display, "none", "Escape hides the tooltip");
      t.blur(); reset(w);
    });

    await test(`decoration is hidden, headings are in order ${tag}`, async () => {
      reset(w);
      assert($$(w, "#thread .av").every(a => a.getAttribute("aria-hidden") === "true"), "avatars hidden from screen readers");
      eq($$(w, "h1").length, 1, "one h1"); assert($(w, ".win h2#title"), "issue title is an h2");
      eq($(w, "#reset").getAttribute("aria-label"), "Reset", "Reset's name matches its text");
      assert(/new tab/.test($(w, ".js-request").textContent), "new-tab links say so");
    });

    await test(`Turbo can be paused, stepped, and holds while focus is in the thread ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      assert(w.getComputedStyle($(w, "#cycctl")).visibility === "hidden", "no Turbo controls with Boring");
      $(w, "[data-key=style] [data-v=custom]").click();
      try {
        const at = () => w.eval("s.turbo"), n = w.eval("TURBO.length"), start = at();
        assert(w.getComputedStyle($(w, "#cycctl")).visibility === "visible", "controls show in Turbo");
        const prompt = $(w, "#prompt h1");
        $(w, "#pause").click();
        assert(!w.__turboT && $(w, "#cycle").classList.contains("paused"), "paused: clock and bar stop");
        eq($(w, "#pause").getAttribute("aria-label"), "Play examples", "button now offers play");
        $(w, "#cycctl [data-step='1']").click(); eq(at(), (start + 1) % n, "next works while paused");
        assert(!w.__turboT, "stepping keeps it paused");
        $(w, "#cycctl [data-step='-1']").click(); eq(at(), start, "previous works");
        $(w, "#pause").click(); assert(w.__turboT, "play resumes the clock");
        eq($(w, "#prompt h1"), prompt, "the live prompt isn't re-announced on a swap");
        $(w, "#thread .tag").focus(); assert(!w.__turboT, "focus in the thread holds the clock");
        $(w, "#pause").focus(); assert(w.__turboT, "leaving the thread resumes it");
      } finally { reset(w); }
    });

    if (width === 1280) await test(`every visible text passes contrast, in every state`, async () => {
      const scheme = w.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      const fails = [];
      const check = label => { const b = lowContrast(w); if (b.length) fails.push(`${label}: ${b.join(", ")}`); };
      reset(w); check("today");
      pick(w, "agent"); check("after a guess");
      $(w, "[data-key=style] [data-v=custom]").click();
      try { check("Turbo"); $(w, "#thread .tag").focus(); check("tooltip open"); }
      finally { $(w, "#thread .tag").blur(); reset(w); }
      assert(!fails.length, `${scheme} mode: ` + fails.join("; "));
    });

    await test(`text and the Turbo rainbow meet contrast minimums ${tag}`, async () => {
      reset(w); mode(w, "proposal");
      const bg = w.getComputedStyle(w.document.body).backgroundColor;
      for (const sel of ["#prompt p", "#reset"]) {
        const el = $(w, sel); if (!el || !el.offsetWidth) continue;
        const r = contrast(w.getComputedStyle(el).color, bg);
        assert(r >= 4.5, `${sel} contrast ${r.toFixed(2)}`);
      }
      const stops = w.getComputedStyle($(w, "[data-key=style]")).getPropertyValue("--rb").split(",").map(c => c.trim());
      const probe = w.document.createElement("span"); w.document.body.appendChild(probe);
      const surface = w.getComputedStyle($(w, "[data-key=style] [data-v=purple]")).backgroundColor;
      for (const c of stops) {
        probe.style.color = c; const r = contrast(w.getComputedStyle(probe).color, w.getComputedStyle(w.document.body).backgroundColor);
        assert(r >= 4.5, `rainbow ${c} contrast ${r.toFixed(2)}`);
      }
      probe.remove(); reset(w);
    });

    await test(`reset cancels a reveal in progress ${tag}`, async () => {
      reset(w); pick(w, "agent"); reset(w);
      assert(!$(w, ".seg.mode").classList.contains("reveal"), "reveal class still set");
      eq(h1(w), "Spot the slop.", "headline after reset");
    });
  }

  // Reduced motion: the catch-all rule exists and, applied, stops everything.
  {
    const w = await load(SITE, 1280);
    await test("titles and link previews tell one story", async () => {
      const meta = (d, k) => (d.querySelector(`meta[name="${k}"], meta[property="${k}"]`) || {}).content;
      const d = w.document, line = "An agent using your token looks exactly like you.";
      eq(d.title, "Spot the slop · A simple request to GitHub", "tab title");
      eq(meta(d, "og:title"), "A simple request to GitHub", "preview title");
      assert(/^https:\/\/.+\/og\.png$/.test(meta(d, "og:image")), "preview image is a full URL (link previews need one)");
      assert(meta(d, "og:description").startsWith(line) && meta(d, "description") === meta(d, "og:description"), "preview and search text share the line");
      reset(w); assert(d.querySelector("#prompt").textContent.replace(/\s+/g, " ").includes("an agent using your token looks exactly like you"), "the page says the same thing");
    });

    await test("prefers-reduced-motion stops all motion", async () => {
      const rule = [...w.document.styleSheets[0].cssRules].find(r => r.media && r.media.mediaText.includes("prefers-reduced-motion"));
      assert(rule, "no prefers-reduced-motion rule");
      const style = w.document.createElement("style");
      style.textContent = [...rule.cssRules].map(r => r.cssText).join("\n");
      w.document.head.appendChild(style);
      reset(w); pick(w, "agent");
      const running = w.document.getAnimations().length;
      eq(running, 0, "running animations/transitions");
      eq(w.getComputedStyle($(w, "#thread .tag")).opacity, "1", "tag visible without animation");
      style.remove(); reset(w);
    });
  }

  // The discussion draft stays short, like popular requests in the category.
  await test("discussion draft is short and has no images or placeholders", async () => {
    const md = (await fetch(DRAFT, { cache: "no-store" }).then(r => r.text())).replace(/^\s*<!--[\s\S]*?-->\s*/, "");
    assert(md.startsWith("# Allow well-behaved agents to self identify"), "title");
    const words = md.replace(/\]\([^)]*\)/g, "]").trim().split(/\s+/).length;
    assert(words < 250, `draft should stay short (${words} words)`);
    assert(/Possible implementations/.test(md), "lists possible implementations");
    assert(!/!\[|<img|SITE_URL|attach /.test(md), "no images or placeholders");
  });

  // Report
  const failed = results.filter(r => !r.ok);
  document.getElementById("summary").innerHTML = failed.length
    ? `<span class="fail">${failed.length} failed</span>, ${results.length - failed.length} passed`
    : `<span class="pass">All ${results.length} passed</span>`;
  document.getElementById("list").innerHTML = results.map(r =>
    `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "✓" : "✗"} ${r.name}${r.ok ? "" : ` <small>${r.error.replace(/</g, "&lt;")}</small>`}</li>`).join("");
  document.getElementById("results").textContent = JSON.stringify(results);
  document.title = failed.length ? "FAIL" : "PASS";
})();
</script>
</body>
</html>
