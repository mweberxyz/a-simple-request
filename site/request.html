<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Feature Request</title>
<meta name="description" content="The full text of the feature request to GitHub: tag what agents post under your name.">
<meta property="og:title" content="A simple request to GitHub: the full feature request">
<meta property="og:image" content="og.png">
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --ink: #1c1d21; --ink-2: #4a4e57; --ink-3: #737885;
  --line: #e4e2dc; --brand: #6d3fd6; --brand-ink: #fff; --brand-soft: #f1ebff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131318; --surface: #1b1b22; --ink: #f0eff4; --ink-2: #b9b8c4; --ink-3: #8b8a97;
    --line: #2c2c36; --brand: #a98bff; --brand-ink: #160b33; --brand-soft: #241c3d;
  }
}
:root[data-theme="dark"] {
  --bg: #131318; --surface: #1b1b22; --ink: #f0eff4; --ink-2: #b9b8c4; --ink-3: #8b8a97;
  --line: #2c2c36; --brand: #a98bff; --brand-ink: #160b33; --brand-soft: #241c3d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--brand); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 32px; } }
nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0; flex-wrap: wrap; }
nav a.back { text-decoration: none; font-weight: 600; font-size: 15px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 15px; text-decoration: none; background: var(--brand); color: var(--brand-ink); }
.note { background: var(--brand-soft); border-radius: 12px; padding: 12px 16px; font-size: 14.5px; color: var(--ink-2); margin: 8px 0 28px; }
.note b { color: var(--ink); }
#doc { padding-bottom: 64px; overflow-wrap: anywhere; }
#doc h1 { font-size: clamp(28px, 4.5vw, 40px); line-height: 1.12; letter-spacing: -.02em; margin: 0 0 24px; }
#doc h2 { font-size: 24px; letter-spacing: -.01em; margin: 44px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); }
#doc h3 { font-size: 18px; margin: 28px 0 8px; }
#doc p, #doc li { color: var(--ink-2); }
#doc strong { color: var(--ink); }
#doc ul { padding-left: 22px; }
#doc li { margin-bottom: 6px; }
#doc code { font: .86em ui-monospace, SFMono-Regular, Menlo, monospace; background: color-mix(in srgb, var(--ink) 8%, transparent); padding: .1em .35em; border-radius: 4px; }
#doc hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0 20px; }
#doc img { display: block; max-width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); margin: 18px 0 8px; }
#doc .cap { font-size: 13px; color: var(--ink-3); margin: 0 0 20px; }
.tbl { overflow-x: auto; margin: 16px 0; }
#doc table { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 480px; }
#doc th, #doc td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
#doc th { color: var(--ink); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
#doc td:first-child { font-weight: 600; color: var(--ink); white-space: nowrap; }
@media (max-width: 560px) {
  #doc table { min-width: 0; }
  #doc thead { display: none; }
  #doc tr, #doc td { display: block; }
  #doc tr { padding: 12px 0; border-bottom: 1px solid var(--line); }
  #doc td { border: 0; padding: 2px 0; white-space: normal !important; }
}
.err { color: #cf222e; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="back" href="./">← Back to the demo</a>
    <a class="btn js-request" href="#">Support it on GitHub ↗</a>
  </nav>
  <div class="note"><b>This is the full feature request</b> as posted to GitHub Community discussions. Upvote and comment there; that's what GitHub counts. <span id="updated"></span></div>
  <article id="doc"><p>Loading…</p></article>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// ---- Keep in sync with index.html ----
const REQUEST_URL = "https://github.com/orgs/community/discussions/REPLACE_ME";
// --------------------------------------
document.querySelectorAll(".js-request").forEach(a => { a.href = REQUEST_URL; a.target = "_blank"; a.rel = "noopener"; });

const CAPTIONS = {
  "1-comment-thread.png": "Mockup 1: the agent tag on a comment.",
  "2-token-settings.png": "Mockup 2: choosing the session type when creating a token.",
  "3-pull-request.png": "Mockup 3: endorsing an agent's PR, and filtering agent activity.",
  "4-tag-styles.png": "Mockup 4: tag style options.",
};

(async () => {
  const doc = document.getElementById("doc");
  try {
    const res = await fetch("request.md", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    let md = await res.text();
    md = md.replace(/^\s*<!--[\s\S]*?-->\s*/, "");                       // posting notes at the top
    md = md.replace(/<!--\s*attach\s+(\S+\.png)\s*-->/g, (_, f) =>        // image slots → images
      `\n<img src="mockups/${f}" alt="${CAPTIONS[f] || f}" loading="lazy"><p class="cap">${CAPTIONS[f] || ""}</p>\n`);
    md = md.replace(/SITE_URL/g, location.origin + location.pathname.replace(/request\.html$/, ""));
    doc.innerHTML = marked.parse(md);
    doc.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
    doc.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    const lm = res.headers.get("Last-Modified");
    if (lm) document.getElementById("updated").textContent = "Last updated " + new Date(lm).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) + ".";
  } catch (e) {
    doc.innerHTML = `<p class="err">Couldn't load the feature request (${String(e.message || e)}).</p>`;
  }
})();
</script>
</body>
</html>
