<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --ink: #1c1d21; --ink-2: #4a4e57; --ink-3: #737885;
  --line: #e4e2dc; --brand: #6d3fd6; --brand-ink: #fff; --brand-soft: #f1ebff;
  --gh-fg: #1f2328; --gh-muted: #59636e; --gh-border: #d1d9e0; --gh-canvas: #f6f8fa; --gh-green: #1a7f37;
  --shadow: 0 1px 2px rgba(20,20,30,.06), 0 12px 32px rgba(20,20,30,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131318; --surface: #1b1b22; --ink: #f0eff4; --ink-2: #b9b8c4; --ink-3: #8b8a97;
    --line: #2c2c36; --brand: #a98bff; --brand-ink: #160b33; --brand-soft: #241c3d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #131318; --surface: #1b1b22; --ink: #f0eff4; --ink-2: #b9b8c4; --ink-3: #8b8a97;
  --line: #2c2c36; --brand: #a98bff; --brand-ink: #160b33; --brand-soft: #241c3d;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--brand); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 32px; } }
code { font: .86em ui-monospace, SFMono-Regular, Menlo, monospace; background: color-mix(in srgb, var(--ink) 8%, transparent); padding: .1em .35em; border-radius: 4px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em; margin: 0; }
.brand span { color: var(--ink-3); font-weight: 500; }
.top nav { display: flex; align-items: center; gap: 14px; }
.top nav a.plain { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; }
.top nav a.plain:hover { color: var(--ink); }
@media (max-width: 560px) { .top { flex-wrap: nowrap; } .brand { font-size: 14px; } .brand span, .top nav a.plain { display: none; } }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 16px; text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: var(--surface); cursor: pointer; }
.btn.sm { padding: 7px 14px; font-size: 14px; border-radius: 8px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn:hover { filter: brightness(1.05); }

/* stage: the page opens on the demo */
main.wrap { max-width: 1140px; }
.stage { max-width: 1076px; margin: 0 auto; padding: 12px 0 40px; display: flex; flex-direction: column; }
@media (max-width: 720px) { .prompt { min-height: 0; margin-bottom: 16px; } .prompt h1 { font-size: 25px; } .prompt p { font-size: 15.5px; } }
.prompt { margin: 8px 0 22px; }
.prompt h1 { font-size: clamp(26px, 4.2vw, 40px); line-height: 1.12; letter-spacing: -.02em; margin: 0 0 10px; }
.prompt p { margin: 0; color: var(--ink-2); font-size: clamp(16px, 2vw, 18px); }
.prompt .you { font-style: normal; font-weight: 800; color: var(--ink); display: inline-block; position: relative; z-index: 0; padding: 0 .08em; margin: 0 .2em; transform: rotate(-1.5deg); }
.prompt .you::before { content: ""; position: absolute; z-index: -1; left: -.22em; right: -.22em; top: -.12em; bottom: -.14em; background: color-mix(in srgb, var(--brand) 45%, transparent); border-radius: .25em .55em .3em .5em / .5em .35em .55em .3em; transform: skewX(-8deg); transform-origin: left center; animation: marker .5s cubic-bezier(.3,.7,.3,1) both; }
.prompt .you:nth-of-type(2) { transform: rotate(1.2deg); }
.prompt .you:nth-of-type(2)::before { animation-delay: .35s; }
@keyframes marker { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.prompt .next { color: var(--brand); font-weight: 700; text-decoration: none; white-space: nowrap; }
.prompt .next:hover { text-decoration: underline; }
.prompt .again { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; }
.tagctl { margin-left: auto; position: relative; display: flex; align-items: center; gap: 7px; }
.tagctl.off { visibility: hidden; }
.tagctl .seg { padding: 4px; border-radius: 11px; }
.tagctl .seg button { font-size: 15px; padding: 10px 16px; border-radius: 8px; }
/* Turbo: rainbow text that keeps flowing, plus a little wiggle every few seconds until someone tries it. */
.seg button.turbo { font-size: 17px; font-weight: 800; padding: 9px 16px; animation: turboNudge 3.2s ease-in-out 1.5s infinite, turboGlow 2.4s linear infinite; }
.seg button.turbo[aria-pressed="true"] { animation: turboGlow 2.4s linear infinite; }
.turbo .rb { background: linear-gradient(90deg, #ff4d6d, #ff9f1c, #e8c400, #2ec4b6, #3a86ff, #8338ec, #ff4d6d) 0 0 / 56px 100% repeat-x; -webkit-background-clip: text; background-clip: text; color: transparent; animation: rainbow 1.6s linear infinite; }
@keyframes rainbow { to { background-position: 56px 0; } }
@keyframes turboGlow { 0%, 100% { box-shadow: 0 0 0 1.5px #ff4d6d, 0 0 12px #ff4d6d80; } 20% { box-shadow: 0 0 0 1.5px #ff9f1c, 0 0 12px #ff9f1c80; } 40% { box-shadow: 0 0 0 1.5px #2ec4b6, 0 0 12px #2ec4b680; } 60% { box-shadow: 0 0 0 1.5px #3a86ff, 0 0 12px #3a86ff80; } 80% { box-shadow: 0 0 0 1.5px #8338ec, 0 0 12px #8338ec80; } }
@keyframes turboNudge { 0%, 78%, 100% { transform: none; } 82% { transform: scale(1.14) rotate(-4deg); } 87% { transform: scale(1.14) rotate(4deg); } 92% { transform: scale(1.06) rotate(-2deg); } 96% { transform: scale(1); } }
.seg { display: flex; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: 600 13px/1 inherit; font-family: inherit; padding: 8px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.switch { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 16px; }
.seg.mode { position: relative; padding: 5px; gap: 0; border-radius: 14px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.seg.mode button { position: relative; z-index: 1; font-size: 18px; font-weight: 700; padding: 15px 28px; border-radius: 10px; background: transparent !important; box-shadow: none !important; color: var(--ink-2); transition: color .3s; }
.seg.mode button[aria-pressed="true"] { color: var(--brand-ink); }
.seg.mode .thumb { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 10px; background: var(--brand); box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 45%, transparent); transition: transform .35s cubic-bezier(.3,.7,.3,1), width .35s cubic-bezier(.3,.7,.3,1); }
.seg.mode.still .thumb { transition: none; }
.seg.mode.reveal .thumb { transition: transform .9s cubic-bezier(.7,0,.2,1.3), width .9s cubic-bezier(.7,0,.2,1.3); }
.seg.mode.reveal button { transition: color .3s .55s; }
.seg.mode.reveal { animation: switchPop 1.3s cubic-bezier(.3,.7,.3,1) .75s; }
@keyframes switchPop { 0% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 70%, transparent); } 25% { transform: scale(1.09); box-shadow: 0 0 0 10px color-mix(in srgb, var(--brand) 35%, transparent); } 55% { transform: scale(.98); } 100% { transform: scale(1); box-shadow: 0 0 0 28px transparent; } }
.tag.pop { animation: tagPop .8s cubic-bezier(.3,1.7,.5,1) 1s both; }
.tag.pop.pop-quick { animation-delay: .2s; }
.tag.swap { animation: tagSwap .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes tagSwap { from { transform: scale(.7); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@keyframes tagPop { 0% { transform: scale(.2); opacity: 0; box-shadow: 0 0 0 0 rgba(130,80,223,.6); } 60% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 0 8px rgba(130,80,223,.25); } 100% { transform: scale(1); box-shadow: 0 0 0 14px rgba(130,80,223,0); } }
@media (max-width: 560px) { .switch { gap: 10px; } .seg.mode button { font-size: 15px; padding: 12px 16px; } .reset span { display: none; } .reset { font-size: 18px; } }
.reset { background: none; border: 0; color: var(--ink-3); font: inherit; font-size: 13px; cursor: pointer; padding: 8px 0; white-space: nowrap; }
.reset:hover { color: var(--ink); }
.pick { cursor: pointer; transition: box-shadow .15s, transform .15s; }
.pick:hover { box-shadow: 0 0 0 3px var(--brand); transform: translateY(-1px); }
.pick { position: relative; }
.pick::after { content: "I think an agent wrote this"; position: absolute; right: 10px; top: 0; transform: translateY(-50%); z-index: 2; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 12px; line-height: 1; padding: 5px 9px; border-radius: 99px; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; }
.pick:hover::after { opacity: 1; }

/* github-ish window (always light, it's a screenshot) */
.win { background: #fff; color: var(--gh-fg); border-radius: 14px; border: 1px solid #d8dde3; box-shadow: var(--shadow); overflow: hidden; font-size: 14px; line-height: 1.5; color-scheme: light; }
.win .bar { height: 40px; background: var(--gh-canvas); border-bottom: 1px solid var(--gh-border); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--gh-muted); font-size: 13px; white-space: nowrap; overflow: hidden; }
.win .bar i { width: 10px; height: 10px; border-radius: 50%; background: #d1d9e0; flex: none; }
.win .bar b { color: var(--gh-fg); }
.win .body { padding: 18px 16px 20px; }
@media (min-width: 720px) { .win .body { padding: 22px 26px 26px; } }
.win h3 { font-size: 22px; font-weight: 400; margin: 0 0 6px; line-height: 1.25; }
.win h3 span { color: var(--gh-muted); }
.win code { background: rgba(175,184,193,.2); }
.meta { color: var(--gh-muted); padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--gh-border); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.meta b { color: var(--gh-fg); }
.state { background: var(--gh-green); color: #fff; border-radius: 99px; padding: 3px 11px; font-size: 13px; font-weight: 500; margin-right: 4px; }
.c { display: flex; gap: 12px; margin-bottom: 16px; }
.av { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; }
@media (max-width: 560px) { .av { display: none; } }
.box { flex: 1; min-width: 0; border: 1px solid var(--gh-border); border-radius: 6px; }
.box .hd { background: var(--gh-canvas); border-bottom: 1px solid var(--gh-border); padding: 7px 12px; color: var(--gh-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-radius: 6px 6px 0 0; position: relative; }
.box .hd b { color: var(--gh-fg); }
.box .bd { padding: 10px 12px; }
.box .bd p { margin: 0 0 8px; } .box .bd p:last-child { margin: 0; }
.role { margin-left: auto; border: 1px solid var(--gh-border); border-radius: 99px; padding: 0 8px; font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--gh-border); color: var(--gh-muted); border-radius: 99px; padding: 0 7px; font-size: 12px; font-weight: 500; line-height: 18px; cursor: help; position: relative; white-space: nowrap; }
.box .hd .tag { margin: -1px 0; min-width: 0; }
.tag .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.when .short { display: none; }
@media (max-width: 560px) { .box .hd { flex-wrap: nowrap; white-space: nowrap; } .box .hd b, .box .hd .when { flex-shrink: 0; } .box .hd .tag { flex-shrink: 1; } .box .hd .role, .box .hd .via { display: none; } .when .long { display: none; } .when .short { display: inline; } .pick::after { content: none; } }
.tag svg { width: 12px; height: 12px; fill: currentColor; display: none; }
.tag.purple { color: #8250df; border-color: #d8b9ff; background: #fbefff; }
.tag.glyph svg { display: block; }
.tag .tip { display: none; position: absolute; left: -6px; top: calc(100% + 8px); z-index: 5; width: 260px; background: #25292e; color: #fff; font-size: 12px; font-weight: 400; line-height: 1.45; padding: 8px 10px; border-radius: 6px; white-space: normal; box-shadow: 0 6px 18px rgba(0,0,0,.2); cursor: default; }
.tag .tip b { color: #fff; display: block; }
.tag:hover .tip, .tag:focus .tip { display: block; }
.via { color: var(--gh-muted); }




/* Reduced motion: no animation, transitions, or smooth scrolling anywhere. Final states still show. */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .pick:hover { transform: none; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="gl" viewBox="0 0 16 16"><path d="M7.25 1h1.5v2h3A2.25 2.25 0 0 1 14 5.25v6.5A2.25 2.25 0 0 1 11.75 14h-7.5A2.25 2.25 0 0 1 2 11.75v-6.5A2.25 2.25 0 0 1 4.25 3h3V1ZM4.25 4.5a.75.75 0 0 0-.75.75v6.5c0 .41.34.75.75.75h7.5a.75.75 0 0 0 .75-.75v-6.5a.75.75 0 0 0-.75-.75h-7.5ZM6 7a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm4 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></symbol></svg>

<header class="top wrap">
  <p class="brand">A simple request to GitHub <span>· a proposal</span></p>
  <nav><a class="plain" href="request.html">The full request</a><a class="btn sm primary js-request" href="#">Support it ↗</a></nav>
</header>

<main id="demo" class="wrap">
  <div class="stage">
    <div class="prompt" id="prompt" aria-live="polite"></div>

    <div class="switch">
      <div class="seg mode still" data-key="mode" role="group" aria-label="Show GitHub today or tomorrow"><span class="thumb" aria-hidden="true"></span><button data-v="today">GitHub today</button><button data-v="proposal">GitHub tomorrow</button></div>
      <button class="reset" id="reset" title="Start over" aria-label="Start over">↺ <span>Reset</span></button>
      <div class="tagctl off" id="tagctl" role="group" aria-label="Agent tag style">
        <div class="seg" data-key="style"><button data-v="purple">Boring</button><button data-v="custom" class="turbo"><span class="rb">Turbo</span></button></div></div>
    </div>

    <div class="win" role="region" aria-label="Mockup of a GitHub-style issue thread">
      <div class="bar"><i></i><i></i><i></i>&nbsp; acme / <b>http-client</b> › Issues › #4182</div>
      <div class="body">
        <h3>Intermittent <code>ECONNRESET</code> when reusing keep-alive sockets <span>#4182</span></h3>
        <div class="meta"><span class="state">● Open</span> <b>alice-dev</b> opened this issue yesterday</div>
        <div id="thread"></div>
      </div>
    </div>

  </div>
</main>

<script>
// ---- Fill these in at launch ----
const REQUEST_URL = "https://github.com/orgs/community/discussions/REPLACE_ME";
// ---------------------------------
document.querySelectorAll(".js-request").forEach(a => { a.href = REQUEST_URL; a.target = "_blank"; a.rel = "noopener"; });

// Turbo shows what people could build on top of the agent flag: it cycles through these on its own.
const TURBO = [
  { text: "triage",      fg: "#0969da", bd: "#80ccff", bg: "#ddf4ff" },
  { text: "night shift", fg: "#9a6700", bd: "#eac54f", bg: "#fff8c5" },
  { text: "deps",        fg: "#cf222e", bd: "#ff8182", bg: "#ffebe9" },
  { text: "docs",        fg: "#bf3989", bd: "#ff80c8", bg: "#ffeff7" },
  { text: "flaky tests", fg: "#bc4c00", bd: "#ffb77c", bg: "#fff1e5" },
];
const initial = () => ({ mode: "today", guess: null, style: "purple", turbo: 0 });
let s = initial();

const when = (long, short) => `<span class="when"><span class="long">${long}</span><span class="short">${short}</span></span>`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const AGENT_OWNER = "github-user-b";
function tagHTML(owner = AGENT_OWNER, via = "") {
  let cls = "tag", style = "", label = "agent";
  if (s.style === "purple") cls += " purple glyph";
  if (s.style === "custom") {
    const c = TURBO[s.turbo]; cls += " glyph";
    style = `color:${c.fg};border-color:${c.bd};background:${c.bg}`;
    label += " · " + esc(c.text);
    if (s.swapped) cls += " swap";
  }
  if (s.justRevealed) cls += s.justRevealed === "toggle" ? " pop pop-quick" : " pop";
  return `<span class="${cls}" style="${style}" tabindex="0" aria-label="Posted by an agent"><svg aria-hidden="true"><use href="#gl"/></svg><span class="txt">${label}</span><span class="tip" role="tooltip"><b>Posted by an agent on ${owner}'s behalf</b>${via ? `Sent via ${via}. ` : ""}${owner} hasn't reviewed this. The agent session was authorized by ${owner}${via ? " on Nov 4" : ""}.</span></span>`;
}

const alice = `<div class="c"><div class="av" style="background:#bf3989">A</div><div class="box"><div class="hd"><b>alice-dev</b> ${when("commented yesterday", "1d ago")} <span class="role">Member</span></div><div class="bd"><p>After upgrading, about 1 in 200 requests fail with <code>ECONNRESET</code> when the pool reuses an idle socket. Repro attached. What's the right fix?</p></div></div></div>`;
const agentBody = `<p>I reproduced this with the attached script. The server closes idle sockets at 5s, but the pool's keep-alive timeout defaults to 4.9s, so under load a request can go out on a socket the server is already closing.</p><p>Lowering <code>keepAliveTimeout</code> to 4s gives 0 failures in 20,000 requests locally. A draft fix is in #4190.</p>`;
const humanBody = `<p>Changing the default timeout won't fix this. Idle timeouts vary by server and by every proxy in between, so any fixed value loses this race somewhere. Your server sends <code>Keep-Alive: timeout=5</code>: the pool should honor that header, and retry idempotent requests that hit <code>ECONNRESET</code> on a reused socket.</p>`;
const pickable = () => s.mode === "today";
const humanComment = () => `<div class="c"><div class="av" style="background:#0969da">M</div><div class="box${pickable() ? " pick" : ""}" data-pick="human"><div class="hd"><b>github-user-a</b> ${when("commented 2 hours ago", "2h ago")} <span class="role">Member</span></div><div class="bd">${humanBody}</div></div></div>`;

// Where the reveal sends people next. While iterating: the local request page.
// At launch: NEXT_URL = REQUEST_URL, NEXT_LABEL = "Back the proposal on GitHub ↗" (see LAUNCH.md).
const NEXT_URL = "request.html";
const NEXT_LABEL = "Read the proposal →";
const NEXT = ` <a class="next" href="${NEXT_URL}">${NEXT_LABEL}</a>`;
const PROMPTS = {
  ask:     ["Spot the slop.", "That's GitHub today: an agent using <em class=\"you\">your</em> token looks exactly like <em class=\"you\">you</em>. Same for everyone else in this thread. <b>Click the comment you think an agent wrote.</b>"],
  right:   ["Good eye. It sounded right, though.", "github-user-b's agent posted it with github-user-b's token, and nobody reviewed it. The fix passes locally, but any fixed timeout loses the race somewhere. With this proposal the token marks it, so nobody has to read that closely. Hover the tag." + NEXT + ""],
  wrong:   ["Nope. That one's the human.", "The confident fix below it came from github-user-b's agent, posted with github-user-b's token and never reviewed. With this proposal, the token marks everything an agent posts. Hover the tag." + NEXT + ""],
  shown:   ["Same thread, GitHub tomorrow.", "The token github-user-b's agent used marks everything it posts, right next to github-user-b's name. Hover the tag." + NEXT + ""],
  back:    ["Back to today. Can you still spot it?", "Nothing to go on but the writing. <button class=\"again\" data-go=\"proposal\">Show me tomorrow →</button>"],
};
function promptKey() {
  if (s.mode === "today") return s.guess ? "back" : "ask";
  return s.guess ? s.guess : "shown";
}

function agentComment() {
  const av = `<div class="av" style="background:#8250df">C</div>`;
  const head = tagged => `<b>${AGENT_OWNER}</b> ${tagged ? tagHTML() + " " : ""}${when("commented 2 hours ago", "2h ago")} <span class="role">Member</span>`;
  if (s.mode === "today") {
    return `<div class="c">${av}<div class="box${pickable() ? " pick" : ""}" data-pick="agent"><div class="hd">${head(false)}</div><div class="bd">${agentBody}</div></div></div>`;
  }
  return `<div class="c">${av}<div class="box"><div class="hd">${head(true)}</div><div class="bd">${agentBody}</div></div></div>`;
}

function placeThumb() {
  const seg = document.querySelector(".seg.mode"), act = seg.querySelector('[aria-pressed="true"]'), th = seg.querySelector(".thumb");
  if (!act) return;
  th.style.width = act.offsetWidth + "px"; th.style.transform = `translateX(${act.offsetLeft}px)`;
}
function render() {
  document.getElementById("thread").innerHTML = alice + humanComment() + agentComment();
  const [h, sub] = PROMPTS[promptKey()];
  const touch = matchMedia("(hover: none)").matches;
  document.getElementById("prompt").innerHTML = `<h1>${h}</h1><p>${touch ? sub.replace(/Hover the tag/g, "Tap the tag") : sub}</p>`;
  const tc = document.getElementById("tagctl"); tc.classList.toggle("off", s.mode !== "proposal"); tc.inert = s.mode !== "proposal";
  document.querySelectorAll(".seg").forEach(seg => {
    const key = seg.dataset.key;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === s[key])));
  });
  placeThumb();
  s.justRevealed = false; s.swapped = false;
  const cycling = s.mode === "proposal" && s.style === "custom";
  if (cycling && !window.__turboT) window.__turboT = setInterval(turboTick, 2000);
  if (!cycling && window.__turboT) { clearInterval(window.__turboT); window.__turboT = null; }
}

function turboTick() { s.turbo = (s.turbo + 1) % TURBO.length; s.swapped = true; render(); }
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (seg.dataset.key === "mode" && b.dataset.v === "proposal" && s.mode !== "proposal") s.justRevealed = "toggle";
  s[seg.dataset.key] = b.dataset.v; render();
}));
// Keep the page still: size the prompt to its tallest message at this width.
function sizePrompt() {
  const el = document.getElementById("prompt");
  const probe = el.cloneNode(false); probe.removeAttribute("id");
  probe.style.cssText = `position:absolute;visibility:hidden;left:0;top:0;width:${el.clientWidth}px;min-height:0;margin:0`;
  document.body.appendChild(probe);
  let max = 0;
  for (const [h, sub] of Object.values(PROMPTS)) { probe.innerHTML = `<h1>${h}</h1><p>${sub}</p>`; max = Math.max(max, probe.getBoundingClientRect().height); }
  probe.remove(); el.style.minHeight = Math.ceil(max) + "px";
}
addEventListener("resize", sizePrompt);
if (document.fonts) document.fonts.ready.then(sizePrompt);
document.getElementById("thread").addEventListener("click", ev => {
  const box = ev.target.closest(".pick"); if (!box) return;
  s.guess = box.dataset.pick === "agent" ? "right" : "wrong"; s.mode = "proposal"; s.justRevealed = true;
  const seg = document.querySelector(".seg.mode"); seg.classList.remove("reveal"); void seg.offsetWidth; seg.classList.add("reveal");
  clearTimeout(window.__revealT); window.__revealT = setTimeout(() => seg.classList.remove("reveal"), 2300);
  render();
  const tag = document.querySelector("#thread .tag");
  if (tag) { const r = tag.getBoundingClientRect(); if (r.bottom > innerHeight - 40 || r.top < 0) tag.closest(".c").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "end" }); }
});
document.getElementById("prompt").addEventListener("click", ev => {
  const b = ev.target.closest("[data-go]"); if (!b) return; if (b.dataset.go === "proposal" && s.mode !== "proposal") s.justRevealed = "toggle"; s.mode = b.dataset.go; render();
});
document.getElementById("reset").onclick = () => { clearTimeout(window.__revealT); document.querySelector(".seg.mode").classList.remove("reveal"); s = initial(); render(); };
render();
sizePrompt();
requestAnimationFrame(() => requestAnimationFrame(() => document.querySelector(".seg.mode").classList.remove("still")));
addEventListener("resize", placeThumb);
if (document.fonts) document.fonts.ready.then(placeThumb);
</script>
