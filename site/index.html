<script>
// ---- Fill these in at launch ----
const REQUEST_URL = "https://github.com/orgs/community/discussions/REPLACE_ME";
// ---------------------------------
document.querySelectorAll(".js-request").forEach(a => { a.href = REQUEST_URL; a.target = "_blank"; a.rel = "noopener"; a.insertAdjacentHTML("beforeend", '<span class="sr-only"> (opens in a new tab)</span>'); });

// The puzzle thread (today, and tomorrow with the Boring tag).
const MAIN = {
  num: 4182, title: "Intermittent <code>ECONNRESET</code> when reusing keep-alive sockets",
  ask: "<p>After upgrading, about 1 in 200 requests fail with <code>ECONNRESET</code> when the pool reuses an idle socket. Repro attached. What's the right fix?</p>",
  human: "<p>Changing the default timeout won't fix this. Idle timeouts vary by server and by every proxy in between, so any fixed value loses this race somewhere. Your server sends <code>Keep-Alive: timeout=5</code>: the pool should honor that header, and retry idempotent requests that hit <code>ECONNRESET</code> on a reused socket.</p>",
  agent: "<p>I reproduced this with the attached script. The server closes idle sockets at 5s, but the pool's keep-alive timeout defaults to 4.9s, so under load a request can go out on a socket the server is already closing.</p><p>Lowering <code>keepAliveTimeout</code> to 4s gives 0 failures in 20,000 requests locally. A draft fix is in #4190.</p>",
};
// Turbo shows what people could build on top of the agent flag: it cycles through these
// on its own, and each one swaps in a conversation where that kind of agent makes sense.
// No green (it reads as "verified").
const TURBO = [
  { text: "triage", fg: "#0969da", bd: "#80ccff", bg: "#ddf4ff",
    num: 4196, title: "Docs search returns nothing for “pool”",
    ask: "<p>Since yesterday's release, searching the docs for <code>pool</code> or <code>keepAlive</code> returns no results.</p>",
    human: "<p>Confirmed. The release job skipped rebuilding the search index. I'll rerun it.</p>",
    agent: "<p>Labeled <b>docs</b> and <b>regression</b>, and added this to the 4.2 milestone. Likely duplicate of #4171 (search index not rebuilt on tag releases).</p>" },
  { text: "night shift", fg: "#9a6700", bd: "#eac54f", bg: "#fff8c5",
    num: 4199, title: "CI failing on main since 02:00",
    ask: "<p>Every job on <code>main</code> has failed at the install step since about 2am.</p>",
    human: "<p>The lockfile pins <code>mock-server@3.1.0</code>, which was unpublished overnight.</p>",
    agent: "<p>While you were offline: I bisected the first failure to 3f9c2e1 and opened #4201, which pins <code>mock-server@3.0.9</code>. CI is green on that branch. Nothing merged.</p>" },
  { text: "deps", fg: "#cf222e", bd: "#ff8182", bg: "#ffebe9",
    num: 4203, title: "Bump http-parser for the request smuggling advisory",
    ask: "<p>http-parser 2.4 fixes the request smuggling advisory published this week. Can we bump it?</p>",
    human: "<p>Yes, but 2.4 rejects duplicate <code>Content-Length</code> headers, so our lenient-headers test will need updating.</p>",
    agent: "<p>Opened #4205: http-parser 2.3.1 → 2.4.0. Changelog: 3 fixes, 1 breaking change (duplicate <code>Content-Length</code> now rejected). 1 failing test: <code>lenient-headers.test.js</code>.</p>" },
  { text: "docs", fg: "#bf3989", bd: "#ff80c8", bg: "#ffeff7",
    num: 4208, title: "<code>keepAliveTimeout</code> isn't in the API reference",
    ask: "<p>The option exists in the code but not in the docs. What does it default to?</p>",
    human: "<p>4.9 seconds. Keep it below your server's idle timeout, or you'll see <code>ECONNRESET</code> on reused sockets.</p>",
    agent: "<p>Drafted the missing entry in #4210: <code>keepAliveTimeout</code> (number, default <code>4900</code>), how long an idle socket stays in the pool, with a note about server idle timeouts.</p>" },
  { text: "flaky tests", fg: "#bc4c00", bd: "#ffb77c", bg: "#fff1e5",
    num: 4212, title: "<code>retry.test.js</code> fails about 1 in 30 runs",
    ask: "<p>Intermittent timeouts in <code>retry.test.js</code> on CI. Never reproduces locally.</p>",
    human: "<p>It waits on a real 100 ms timer. On a loaded CI runner the retry fires late.</p>",
    agent: "<p>This test failed 14 of the last 400 CI runs, all on Linux runners. #4214 switches it to fake timers: 0 failures in 1,000 reruns.</p>" },
];
const scenario = () => s.mode === "proposal" && s.style === "custom" ? TURBO[s.turbo] : MAIN;
const initial = () => ({ mode: "today", guess: null, style: "purple", turbo: 0, paused: false, hold: false });
let s = initial();

const when = (long, short) => `<span class="when"><span class="long">${long}</span><span class="short">${short}</span></span>`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const AGENT_OWNER = "github-user-b";
function tagHTML(owner = AGENT_OWNER, via = "") {
  let cls = "tag", style = "", label = "agent";
  if (s.style === "purple") cls += " purple glyph";
  if (s.style === "custom") {
    const c = TURBO[s.turbo]; cls += " glyph";
    style = `color:${c.fg};border-color:${c.bd};background:${c.bg}`;
    label += " · " + esc(c.text);
    if (s.swapped) cls += " swap";
  }
  if (s.justRevealed) cls += s.justRevealed === "toggle" ? " pop pop-quick" : " pop";
  return `<button type="button" class="${cls}" style="${style}" aria-labelledby="tagtxt" aria-describedby="tagtip"><svg aria-hidden="true"><use href="#gl"/></svg><span class="txt" id="tagtxt">${label}</span><span class="tip" role="tooltip" id="tagtip"><b>Posted by an agent on ${owner}'s behalf</b>${via ? `Sent via ${via}. ` : ""}${owner} hasn't reviewed this. ${owner} turned on agent attribution for this token${via ? " on Nov 4" : ""}.</span></button>`;
}

const pickable = () => s.mode === "today";
const humanComment = () => `<div class="c"><div class="av" aria-hidden="true" style="background:#0969da"><svg viewBox="0 0 16 16" width="18" height="18" fill="#fff" aria-hidden="true"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg></div><div class="box${pickable() ? " pick" : ""}" data-pick="human"><div class="hd">${pickable() ? `<button type="button" class="guess" aria-label="I think an agent wrote this, github-user-a's comment">I think an agent wrote this</button>` : ""}<b>github-user-a</b> ${when("commented 2 hours ago", "2h ago")} <span class="role">Member</span></div><div class="bd">${scenario().human}</div></div></div>`;

const PROMPTS = {
  ask:     ["Spot the slop.", "That's GitHub today: an agent using <em class=\"you\">your</em> token looks exactly like <em class=\"you\">you</em>. Same for everyone else in this thread. <b>Click the comment you think an agent wrote.</b>"],
  right:   ["Good eye. It sounded right, though.", "The second user's agent posted it with the second user's token, and nobody can tell the difference."],
  wrong:   ["Nope. That one's the human.", "The confident fix below it came from the second user's agent, posted with the second user's token, and nobody can tell the difference."],
  shown:   ["Same thread, GitHub tomorrow.", "The token your agent used marks everything it posts, right next to your name. Hover the tag."],
  back:    ["Back to today. Can you still spot it?", "Nothing to go on but the writing. <button class=\"again\" data-go=\"proposal\">Show me tomorrow →</button>"],
};
function promptKey() {
  if (s.mode === "today") return s.guess ? "back" : "ask";
  return s.guess ? s.guess : "shown";
}

function agentComment() {
  const av = `<div class="av" aria-hidden="true" style="background:#8250df"><svg viewBox="0 0 16 16" width="18" height="18" fill="#fff" aria-hidden="true"><path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/></svg></div>`;
  const head = tagged => `<b>${AGENT_OWNER}</b> ${tagged ? tagHTML() + " " : ""}${when("commented 2 hours ago", "2h ago")} <span class="role">Member</span>`;
  if (s.mode === "today") {
    return `<div class="c">${av}<div class="box${pickable() ? " pick" : ""}" data-pick="agent"><div class="hd">${pickable() ? `<button type="button" class="guess" aria-label="I think an agent wrote this, ${AGENT_OWNER}'s comment">I think an agent wrote this</button>` : ""}${head(false)}</div><div class="bd">${scenario().agent}</div></div></div>`;
  }
  return `<div class="c">${av}<div class="box"><div class="hd">${head(true)}</div><div class="bd">${scenario().agent}</div></div></div>`;
}

function placeThumb() {
  const seg = document.querySelector(".seg.mode"), act = seg.querySelector('[aria-pressed="true"]'), th = seg.querySelector(".thumb");
  if (!act) return;
  th.style.width = act.offsetWidth + "px"; th.style.transform = `translateX(${act.offsetLeft}px)`;
}
const aliceComment = () => `<div class="c"><div class="av" aria-hidden="true" style="background:#bf3989">A</div><div class="box"><div class="hd"><b>alice-dev</b> ${when("commented yesterday", "1d ago")} <span class="role">Member</span></div><div class="bd">${scenario().ask}</div></div></div>`;
function fillIssue() {
  const sc = scenario();
  document.getElementById("num").textContent = "#" + sc.num;
  document.getElementById("title").innerHTML = `${sc.title} <span>#${sc.num}</span>`;
  document.getElementById("thread").innerHTML = aliceComment() + humanComment() + agentComment();
}
function render() {
  fillIssue();
  const body = document.getElementById("issue");
  if (s.swapped) { body.classList.remove("swap"); void body.offsetWidth; body.classList.add("swap"); }
  const [h, sub] = PROMPTS[promptKey()];
  const touch = matchMedia("(hover: none)").matches;
  const ph = `<h1>${h}</h1><p>${touch ? sub.replace(/Hover the tag/g, "Tap the tag") : sub}</p>`, pe = document.getElementById("prompt");
  if (pe.dataset.html !== ph) { pe.innerHTML = ph; pe.dataset.html = ph; }
  const tc = document.getElementById("tagctl"); tc.classList.toggle("off", s.mode !== "proposal"); tc.inert = s.mode !== "proposal";
  document.querySelectorAll(".seg").forEach(seg => {
    const key = seg.dataset.key;
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === s[key])));
  });
  placeThumb();
  s.justRevealed = false; s.swapped = false;
  runClock();
}

const TURBO_MS = 7000;  // time on each Turbo conversation; the bar under the thread counts it down
function turboTick(dir = 1) { clearTimeout(window.__turboT); window.__turboT = null; window.__turboLeft = null; s.turbo = (s.turbo + dir + TURBO.length) % TURBO.length; s.swapped = true; render(); }
// The Turbo clock. Runs only while Turbo shows; stops while paused or while focus is inside the thread,
// and picks up where it left off.
const cyclingNow = () => s.mode === "proposal" && s.style === "custom";
function runClock() {
  const on = cyclingNow(), bar = document.getElementById("cycle"), ctl = document.getElementById("cycctl"), held = s.paused || s.hold;
  bar.classList.toggle("on", on); ctl.classList.toggle("off", !on); ctl.inert = !on;
  bar.style.setProperty("--c", TURBO[s.turbo].fg);
  const pb = document.getElementById("pause");
  pb.textContent = s.paused ? "▶" : "❚❚"; pb.setAttribute("aria-label", s.paused ? "Play examples" : "Pause examples");
  if (!on) { clearTimeout(window.__turboT); window.__turboT = null; window.__turboLeft = null; bar.classList.remove("run", "paused"); s.paused = false; return; }
  if (window.__turboLeft == null) {          // a fresh example: restart the bar
    window.__turboLeft = TURBO_MS;
    bar.classList.remove("run"); void bar.offsetWidth; bar.querySelector("i").style.animationDuration = TURBO_MS + "ms"; bar.classList.add("run");
  }
  bar.classList.toggle("paused", held);
  if (held && window.__turboT) { clearTimeout(window.__turboT); window.__turboT = null; window.__turboLeft -= Date.now() - window.__turboStart; }
  if (!held && !window.__turboT) { window.__turboStart = Date.now(); window.__turboT = setTimeout(turboTick, Math.max(0, window.__turboLeft)); }
}
document.getElementById("pause").onclick = () => { s.paused = !s.paused; runClock(); };
document.querySelectorAll("#cycctl [data-step]").forEach(b => b.onclick = () => turboTick(+b.dataset.step));
const threadEl = document.getElementById("thread");
threadEl.addEventListener("focusin", () => { s.hold = true; runClock(); });
threadEl.addEventListener("focusout", ev => { if (!threadEl.contains(ev.relatedTarget)) { s.hold = false; runClock(); } });
addEventListener("keydown", ev => { if (ev.key === "Escape") document.querySelectorAll(".tag").forEach(t => t.classList.add("quiet")); });
document.addEventListener("pointerout", ev => { const t = ev.target.closest?.(".tag"); if (t && !t.contains(ev.relatedTarget)) t.classList.remove("quiet"); });
document.addEventListener("focusout", ev => { if (ev.target.classList?.contains("tag")) ev.target.classList.remove("quiet"); });
// Left and right arrows step through the Turbo conversations (and restart the countdown).
addEventListener("keydown", ev => {
  if (!cyclingNow() || ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
  if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
  ev.preventDefault(); turboTick(ev.key === "ArrowRight" ? 1 : -1);
});
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (seg.dataset.key === "mode" && b.dataset.v === "proposal" && s.mode !== "proposal") s.justRevealed = "toggle";
  s[seg.dataset.key] = b.dataset.v; render();
}));
// Keep the page still: size the prompt to its tallest message at this width.
function sizePrompt() {
  const el = document.getElementById("prompt");
  const probe = el.cloneNode(false); probe.removeAttribute("id");
  probe.style.cssText = `position:absolute;visibility:hidden;left:0;top:0;width:${el.clientWidth}px;min-height:0;margin:0`;
  document.body.appendChild(probe);
  let max = 0;
  for (const [h, sub] of Object.values(PROMPTS)) { probe.innerHTML = `<h1>${h}</h1><p>${sub}</p>`; max = Math.max(max, probe.getBoundingClientRect().height); }
  probe.remove(); el.style.minHeight = Math.ceil(max) + "px";
}
addEventListener("resize", sizePrompt);
if (document.fonts) document.fonts.ready.then(sizePrompt);
// Same for the issue: Turbo swaps whole conversations, so reserve the tallest one at this width.
function sizeIssue() {
  const body = document.getElementById("issue"), keep = { ...s };
  body.style.minHeight = "";
  let max = 0;
  for (const st of [{ mode: "today", style: "purple" }, ...TURBO.map((_, i) => ({ mode: "proposal", style: "custom", turbo: i }))]) {
    Object.assign(s, st); fillIssue(); max = Math.max(max, body.getBoundingClientRect().height);
  }
  s = keep; body.style.minHeight = Math.ceil(max) + "px"; fillIssue();
}
addEventListener("resize", sizeIssue);
if (document.fonts) document.fonts.ready.then(sizeIssue);
document.getElementById("thread").addEventListener("click", ev => {
  const box = ev.target.closest(".pick"); if (!box) return;
  const byKeyboard = ev.target.closest(".guess") && ev.detail === 0;
  s.guess = box.dataset.pick === "agent" ? "right" : "wrong"; s.mode = "proposal"; s.justRevealed = true;
  const seg = document.querySelector(".seg.mode"); seg.classList.remove("reveal"); void seg.offsetWidth; seg.classList.add("reveal");
  clearTimeout(window.__revealT); window.__revealT = setTimeout(() => seg.classList.remove("reveal"), 2300);
  render();
  const tag = document.querySelector("#thread .tag");
  if (byKeyboard && tag) tag.focus();   // keep keyboard users where the answer is
  if (tag) { const r = tag.getBoundingClientRect(); if (r.bottom > innerHeight - 40 || r.top < 0) tag.closest(".c").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "end" }); }
});
document.getElementById("prompt").addEventListener("click", ev => {
  const b = ev.target.closest("[data-go]"); if (!b) return; if (b.dataset.go === "proposal" && s.mode !== "proposal") s.justRevealed = "toggle"; s.mode = b.dataset.go; render();
});
document.getElementById("reset").onclick = () => { clearTimeout(window.__revealT); document.querySelector(".seg.mode").classList.remove("reveal"); s = initial(); render(); };
render();
sizePrompt();
sizeIssue();
requestAnimationFrame(() => requestAnimationFrame(() => document.querySelector(".seg.mode").classList.remove("still")));
addEventListener("resize", placeThumb);
if (document.fonts) document.fonts.ready.then(placeThumb);
</script>
</body>
</html>
